[project]
authors = [{name = "Andrew Scouten", email = "andrewscouten@gmail.com"}]
dependencies = ["boto3"]
description = "Data loading for the BIO 4432 project"
name = "hmp_project"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/python/hmp_project"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# tests/python mirrors src/python/hmp_project, so basenames repeat across directories
# (cli/test_convert.py and manifest/test_convert.py). importlib mode keeps them distinct
# without __init__.py files in the test tree.
addopts = "--import-mode=importlib"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
hmp_project = { path = ".", editable = true }

[tool.pixi.tasks]
new = "python -m hmp_project new"
sync = "python -m hmp_project sync"
extract = "python -m hmp_project extract"

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.feature.test.dependencies]
pytest = ">=9.1.1,<10"

[tool.pixi.feature.lint.tasks]
lint = "ruff check . && ruff format --check ."
format = "ruff format . && ruff check --fix ."

[tool.pixi.feature.lint.dependencies]
ruff = ">=0.16.7,<0.17"

# Pixi provides R and renv; renv manages R packages in src/R/renv.lock.
[tool.pixi.feature.r.tasks]
r-restore = { cmd = "Rscript -e 'renv::restore(prompt = FALSE)'", cwd = "src/R" }
r-snapshot = { cmd = "Rscript -e 'renv::snapshot(prompt = FALSE)'", cwd = "src/R" }

[tool.pixi.feature.r.dependencies]
# conda-forge's r-renv builds only go up to R 4.5.
r-base = "4.5.*"
r-renv = ">=1.2.4,<2"

# sra-tools (fasterq-dump) is only on bioconda, which has no Windows builds.
[tool.pixi.feature.sra]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.feature.sra.tasks]
convert = "python -m hmp_project convert"

[tool.pixi.feature.sra.dependencies]
sra-tools = ">=3.4.1,<4"

# Nextflow and nf-test are on bioconda. Docker and Apptainer come from the host or
# cluster, since sites configure them themselves.
[tool.pixi.feature.nextflow]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.feature.nextflow.tasks]
pipeline = "nextflow run ."
test-workflow = "nf-test test"
build-container = { cmd = "docker build -t ghcr.io/bio-4432-txstate-fall2026/project/{{ name }}:latest containers/{{ name }}", args = ["name"] }

[tool.pixi.feature.nextflow.dependencies]
# Nextflow's launcher runs on this JDK through the JAVA_HOME the environment sets.
openjdk = ">=25.0.2,<26"
nextflow = ">=26.4.6,<27"
nf-test = ">=0.9.5,<0.10"

[tool.pixi.environments]
default = { features = ["test", "lint"], solve-group = "default" }
r = { features = ["r"] }
sra = { features = ["sra"] }
nextflow = { features = ["nextflow"], no-default-feature = true }

[tool.pixi.dependencies]
python = ">=3.11"
boto3 = ">=1.43.92,<2"
