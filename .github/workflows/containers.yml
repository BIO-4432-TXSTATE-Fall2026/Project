name: Containers

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "names=$(ls containers/*.Dockerfile \
            | xargs -n1 basename \
            | sed 's/\.Dockerfile$//' \
            | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.list.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # The repository root is the build context: an image installs the project from
          # src/, so the Dockerfile is named rather than implied by the context.
          context: .
          file: containers/${{ matrix.name }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bio-4432-txstate-fall2026/project/${{ matrix.name }}:latest
            ghcr.io/bio-4432-txstate-fall2026/project/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
